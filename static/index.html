<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jewel-AI | Design a ring within your budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--pearl:#EEF0F6;--panel:#fff;--ink:#161A33;--ink2:#262B4F;--mute:#6B7090;--line:#D9DCE8;--brass:#B5832B;--teal:#1F6F6B;--red:#B3402F;
--serif:"Young Serif",Georgia,serif;--sans:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px/1.5 var(--sans);background:var(--pearl);color:var(--ink);display:grid;grid-template-columns:380px 1fr}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
/* chat */
aside{background:var(--ink);color:#EDEFF8;display:flex;flex-direction:column;height:100vh;min-height:0}
.brand{padding:22px 24px 8px;font:26px var(--serif)}
.brand small{display:block;font:400 14px var(--sans);color:#A9AED0;margin-top:2px}
#log{flex:1;overflow:auto;padding:12px 24px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:var(--ink2);white-space:pre-wrap}
.m.u{align-self:flex-end;background:#E9D9B0;color:#2B2208;border-radius:14px 14px 4px 14px}
.m.err{background:#4A2530;color:#FFD9D2}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 24px 8px}
.chip{padding:3px 11px;border-radius:999px;border:1px solid #4B5185;font-size:13px;color:#D6D9F0}
.starters{display:flex;flex-wrap:wrap;gap:6px;padding:0 24px 10px}
.starters button{background:none;border:1px dashed #5A6098;border-radius:8px;padding:5px 10px;font-size:13px;color:#C9CDEA;cursor:pointer}
.starters button:hover{border-color:var(--brass);color:#fff}
#chat{display:flex;gap:8px;padding:12px 24px 22px;border-top:1px solid #2F3563}
#chat input{flex:1;min-width:0;border:1px solid #4B5185;background:#10132A;border-radius:10px;padding:11px 13px;color:#fff}
.btn{background:var(--brass);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:#9C6F20}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
/* stage */
main{height:100vh;overflow:auto;padding:28px 36px}
.hero{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center;max-width:760px;margin:8vh auto 0}
.hero h1{font:34px/1.15 var(--serif);margin:0 0 10px}.hero p{color:var(--mute);margin:0;max-width:46ch}
h2{font:26px var(--serif);margin:0 0 4px}.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .ringbox{background:linear-gradient(180deg,#F7F8FC,#E8EBF4);border-radius:12px;padding:6px}
.card h3{margin:4px 0 0;font:19px var(--serif)}
.price{font:600 24px var(--sans)}
.badge{align-self:flex-start;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px}
.ok{background:#D9EFEC;color:var(--teal)}.over{background:#F6DDD8;color:var(--red)}
.chg{font-size:14px;color:var(--mute);min-height:21px}
.cz{display:grid;grid-template-columns:minmax(240px,380px) 1fr;gap:32px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.row.t{border:0;font-weight:600;font-size:18px;padding-top:10px}
label{display:block;font-weight:500;margin:14px 0 4px;font-size:14px}
select,input[type=range]{width:100%}select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
input[type=range]{accent-color:var(--brass)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .2s}
.bar.over i{background:var(--red)}
.saver{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:#F5F6FB;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;cursor:pointer}
.saver:hover{border-color:var(--brass)}.saver b{color:var(--teal)}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
svg{width:100%;height:auto;display:block;overflow:visible}
.rtag{font-size:12px;color:var(--mute);text-align:center;padding:4px 0 2px}.lnk{display:inline-block;margin-top:6px;font:14px var(--sans);color:#E9D9B0}.strip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px;color:var(--mute)}.strip b{color:var(--ink)}
@media(max-width:860px){body{grid-template-columns:1fr;height:auto}aside{height:70vh}main{height:auto;padding:22px 18px}
.hero,.cz{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="brand">Jewel-AI<small>Your jeweller's design consultant</small><a class="lnk" href="/dashboard.html" target="_blank">Store dashboard</a></div>
  <div id="log" aria-live="polite"></div>
  <div id="chips"></div>
  <div class="starters" id="starters">
    <button data-t="Engagement ring, budget 60000 rupees, I like minimal temple style">Engagement, ₹60,000</button>
    <button data-t="Gift for my wife's anniversary, around 40000, she likes lab diamonds">Anniversary, ₹40,000</button>
    <button id="sample">Skip chat: load a sample</button>
  </div>
  <form id="chat"><input id="inp" placeholder="Describe the occasion, taste and budget" autocomplete="off" aria-label="Message"><button class="btn">Send</button></form>
</aside>
<main id="stage"></main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), inr=n=>'₹'+new Intl.NumberFormat('en-IN').format(n);
const METAL={gold_24k:['#F6D56F','#C9962B','24k gold'],gold_22k:['#EFC55F','#B98A25','22k gold'],gold_18k:['#EDCF8E','#C29A4E','18k gold'],gold_14k:['#E8D8AA','#B9A26A','14k gold']};
const STONE={none:'No stone',cz:'Cubic zirconia',moissanite:'Moissanite',lab_diamond:'Lab-grown diamond',natural_diamond:'Natural diamond'};
const FILL={cz:'#E3ECF7',moissanite:'#E4EEFF',lab_diamond:'#EAF4FF',natural_diamond:'#F4F9FF'};
const blank=()=>({category:'ring',style:'classic solitaire',metal:'gold_22k',band_width_mm:3,ring_size_in:12,stone:{type:'none',carat:0,count:1},occasion:null,budget_inr:null,notes:null});
let S={spec:blank(),msgs:[],variants:[],cur:null,uid:0,imgs:{},run:0};
const imgOf=s=>S.imgs[JSON.stringify(s)];

function ring(sp){
  const id='g'+(S.uid++),[a,b]=METAL[sp.metal],sw=6+sp.band_width_mm*3.2,has=sp.stone.type!=='none',r=has?9+sp.stone.carat*26:0,cy=68-sw/2-r*.55;
  const gem=has?`<polygon points="${100-r*.6},${cy-r*.7} ${100+r*.6},${cy-r*.7} ${100+r},${cy-r*.15} 100,${cy+r*.8} ${100-r},${cy-r*.15}" fill="${FILL[sp.stone.type]}" stroke="#8FA6C6" stroke-width="1.5"/>
  <path d="M${100-r},${cy-r*.15}H${100+r}M${100-r*.6},${cy-r*.7}L100,${cy+r*.8}L${100+r*.6},${cy-r*.7}M${100-r*.3},${cy-r*.15}L100,${cy-r*.7}L${100+r*.3},${cy-r*.15}" stroke="#A9BCD8" stroke-width="1" fill="none"/>`:'';
  return `<svg viewBox="0 -20 200 220" role="img" aria-label="Illustrative ring preview"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient></defs>
  <circle cx="100" cy="124" r="56" fill="none" stroke="url(#${id})" stroke-width="${sw}"/>${gem}</svg>`;
}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){}throw new Error(d||r.statusText)}return r.json()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function say(text,cls=''){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;$('#log').append(d);$('#log').scrollTop=1e9;return d}

function chips(){const s=S.spec,c=[];
  if(s.occasion)c.push(s.occasion);if(s.budget_inr)c.push('Budget '+inr(s.budget_inr));
  c.push(s.style,METAL[s.metal][2],s.stone.type==='none'?'No stone':`${s.stone.carat} ct ${STONE[s.stone.type].toLowerCase()}`);
  $('#chips').innerHTML=c.map(x=>`<span class="chip"></span>`).join('');
  [...$('#chips').children].forEach((e,i)=>e.textContent=c[i]);}

function empty(){$('#stage').innerHTML=`<div class="hero"><div>${ring({metal:'gold_22k',band_width_mm:3,stone:{type:'lab_diamond',carat:.4}})}</div>
  <div><h1>Tell us the occasion and your budget. We'll design a ring that fits both.</h1><p>Three options appear here, each priced from today's gold rate, stone and making charges.</p></div></div>`}

async function send(text){
  if(!text.trim())return;S.msgs.push({role:'user',content:text});say(text,'u');$('#starters').hidden=true;
  const t=say('…');
  try{const d=await api('/api/chat',{messages:S.msgs,spec:S.spec});
    t.textContent=d.reply;S.msgs.push({role:'assistant',content:d.reply});S.spec=d.spec;chips();if(d.ready)await load();}
  catch(e){t.className='m err';t.textContent='Chat is unavailable: '+e.message+'. Pricing still works. Use "Skip chat" to continue.';S.msgs.pop();}
}
async function load(){const d=await api('/api/variants',S.spec);S.variants=d.variants;gallery();
  try{const r=await api('/api/requests',{id:S.reqId||null,status:'designed',spec:S.spec});S.reqId=r.id}catch(e){}}

function gallery(){const b=S.spec.budget_inr;
  $('#stage').innerHTML=`<h2>Three designs${S.spec.occasion?' for your '+S.spec.occasion.toLowerCase():''}</h2><p class="sub">Pick one to adjust metal, stone and band. The price updates as you change them.</p><div class="strip" id="tr"></div><div class="grid" id="g"></div>`;
  S.variants.forEach((v,i)=>{const p=v.price,c=document.createElement('div');c.className='card';
    c.innerHTML=`<div class="ringbox" id="rb${i}">${ring(v.spec)}</div><h3></h3><div class="price">${inr(p.total)}</div>
    <span class="badge ${p.within_budget===false?'over':'ok'}">${p.within_budget===false?inr(p.over_by)+' over budget':'Fits your budget'}</span>
    <div class="chg"></div><button class="btn">Customize</button>`;
    c.querySelector('h3').textContent=v.label;c.querySelector('.chg').textContent=v.changes.length?'Changed: '+v.changes.join(', '):`${METAL[v.spec.metal][2]}, ${v.spec.band_width_mm} mm band`;
    c.querySelector('button').onclick=()=>custom(structuredClone(v.spec));$('#g').append(c)});trends();autoRender();}

function custom(sp){S.cur=sp;const x=sp.stone;
  $('#stage').innerHTML=`<button class="btn ghost" id="back">Back to designs</button><div class="cz" style="margin-top:16px"><div class="panel" id="rv"></div><div>
  <div class="panel"><h2>Adjust your ring</h2>
  <label for="mt">Metal</label><select id="mt">${Object.entries(METAL).map(([k,v])=>`<option value="${k}">${v[2]}</option>`).join('')}</select>
  <label for="st">Stone</label><select id="st">${Object.entries(STONE).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
  <label for="ct">Stone size: <span id="cv"></span></label><input id="ct" type="range" min="0.1" max="1.5" step="0.05">
  <label for="bw">Band width: <span id="bv"></span></label><input id="bw" type="range" min="2" max="6" step="0.5">
  <div class="bar" id="bar"><i></i></div><div id="bl" style="font-size:14px;color:var(--mute)"></div></div>
  <div class="panel" style="margin-top:14px" id="bd"></div><div id="sv"></div>
  <div class="acts"><button class="btn" id="send">Send to jeweller</button><button class="btn ghost" id="sheet">Print artisan sheet</button></div></div></div>`;
  $('#mt').value=sp.metal;$('#st').value=x.type;$('#ct').value=x.carat||.3;$('#bw').value=sp.band_width_mm;
  $('#back').onclick=gallery;
  $('#mt').onchange=e=>{S.cur.metal=e.target.value;upd()};
  $('#st').onchange=e=>{S.cur.stone.type=e.target.value;if(e.target.value!=='none'&&!S.cur.stone.carat)S.cur.stone.carat=+$('#ct').value;upd()};
  $('#ct').oninput=e=>{if(S.cur.stone.type!=='none')S.cur.stone.carat=+e.target.value;upd()};
  $('#bw').oninput=e=>{S.cur.band_width_mm=+e.target.value;upd()};
  $('#send').onclick=async()=>{try{const r=await api('/api/requests',{id:S.reqId||null,status:'sent',spec:S.cur});S.reqId=r.id;toast('Sent to the jeweller')}catch(e){toast('Could not send: '+e.message)}};
  $('#sheet').onclick=sheet;
  upd();}

const FIX={metal_18k:s=>s.metal='gold_18k',lab_diamond:s=>s.stone.type='lab_diamond',moissanite:s=>s.stone.type='moissanite',
  slim_band:s=>s.band_width_mm=Math.max(2,s.band_width_mm-1),smaller_stone:s=>s.stone.carat=Math.round((s.stone.carat-.1)*100)/100};
let tm;function upd(){const s=S.cur,has=s.stone.type!=='none';
  const im=imgOf(s);
  $('#rv').innerHTML=(im?`<img src="${im}" alt="AI render of the ring" style="width:100%;border-radius:12px">`:ring(s))+`<p class="sub" style="margin:8px 0 0;font-size:13px">${im?'AI render. The finished piece may differ.':'Drawn preview. Updates as you adjust.'}</p><button class="btn ghost" id="rb" style="margin-top:10px">Render with AI</button>`;
  $('#rb').onclick=renderAI;
  $('#ct').disabled=!has;$('#cv').textContent=has?s.stone.carat+' ct':'none';$('#bv').textContent=s.band_width_mm+' mm';
  clearTimeout(tm);tm=setTimeout(async()=>{try{const d=await api('/api/price',s),p=d.price;S.price=p;
    $('#bd').innerHTML=[['Gold ('+p.weight_g+' g)',p.metal_cost],['Stone',p.stone_cost],['Stone setting',p.setting_cost],['Making charges',p.making_cost],['GST',p.gst]]
      .map(r=>`<div class="row"><span>${r[0]}</span><span>${inr(r[1])}</span></div>`).join('')+`<div class="row t"><span>Estimated total</span><span>${inr(p.total)}</span></div>`;
    const b=p.budget,over=b&&p.total>b;$('#bar').className='bar'+(over?' over':'');$('#bar i').style.width=b?Math.min(100,p.total/b*100)+'%':'0';
    $('#bl').textContent=b?(over?inr(p.over_by)+' over your '+inr(b)+' budget':inr(b-p.total)+' under your '+inr(b)+' budget'):'';
    $('#sv').innerHTML=over?'<p class="sub" style="margin:14px 0 0">Ways to save</p>':'';
    if(over)d.suggestions.slice(0,3).forEach(g=>{const bt=document.createElement('button');bt.className='saver';bt.innerHTML='<span></span><b></b>';
      bt.firstChild.textContent=g.label;bt.lastChild.textContent='Save '+inr(g.saving);
      bt.onclick=()=>{FIX[g.id](S.cur);$('#mt').value=S.cur.metal;$('#st').value=S.cur.stone.type;$('#ct').value=S.cur.stone.carat||.3;$('#bw').value=S.cur.band_width_mm;upd()};$('#sv').append(bt)});
  }catch(e){$('#bd').textContent='Price unavailable: '+e.message}},120);}

const esc=t=>String(t??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function trends(){const el=$('#tr');if(!el)return;try{const d=await fetch('/api/trends?occasion='+encodeURIComponent(S.spec.occasion||'')+'&style='+encodeURIComponent(S.spec.style||'')).then(r=>r.json());
  el.innerHTML='<b>Trending now</b> ('+(d.source==='google_search'?'from Google Search':'sample data')+'): ';el.append(d.cues.join('; '))}catch(e){el.remove()}}
async function autoRender(){const run=++S.run;let down=false;
  for(let i=0;i<S.variants.length;i++){const v=S.variants[i],k=JSON.stringify(v.spec);let box=$('#rb'+i);
    if(!box||run!==S.run)return;
    if(!S.imgs[k]&&!down){box.insertAdjacentHTML('beforeend','<div class="rtag">Creating AI render... (can take up to a minute)</div>');
      try{const d=await api('/api/render',v.spec);if(d.image)S.imgs[k]=d.image;else down=true}catch(e){down=true}}
    box=$('#rb'+i);if(!box||run!==S.run)return;
    if(S.imgs[k])box.innerHTML=`<img src="${S.imgs[k]}" alt="AI render of the ${esc(v.label)} ring" style="width:100%;border-radius:10px;display:block">`;
    else box.innerHTML=ring(v.spec)+'<div class="rtag">AI render unavailable right now. Showing a drawn preview.</div>'}}
async function renderAI(){const b=$('#rb'),key=JSON.stringify(S.cur);b.disabled=true;b.textContent='Rendering, up to 40 seconds...';
  try{const d=await api('/api/render',S.cur);if(d.image)S.imgs[key]=d.image;else toast('Render service is busy. Keeping the drawn preview.')}catch(e){toast('Render failed: '+e.message)}
  upd()}
function sheet(){const s=S.cur,p=S.price||{},w=window.open('','_blank');if(!w){toast('Allow pop-ups to print the sheet');return}
  const im=imgOf(s)?`<img src="${imgOf(s)}" style="width:260px;border-radius:8px">`:`<div style="width:260px">${ring(s)}</div>`;
  const rows=[['Category','Ring'],['Style',s.style],['Metal',METAL[s.metal][2]],['Band width',s.band_width_mm+' mm'],['Ring size (India)',s.ring_size_in],['Stone',s.stone.type==='none'?'None':`${STONE[s.stone.type]}, ${s.stone.carat} ct x ${s.stone.count}`],['Est. gold weight',(p.weight_g||'-')+' g'],['Occasion',s.occasion||'-'],['Customer budget',s.budget_inr?inr(s.budget_inr):'-']];
  const cost=[['Gold',p.metal_cost],['Stone',p.stone_cost],['Setting',p.setting_cost],['Making',p.making_cost],['GST',p.gst],['Total',p.total]];
  w.document.write(`<title>Artisan sheet</title><body style="font:15px system-ui;max-width:760px;margin:30px auto"><h1 style="font-family:Georgia">Artisan work order</h1><p>${new Date().toLocaleDateString('en-IN')}. Estimate only: confirm weight and rates before quoting.</p><div style="display:flex;gap:24px">${im}<table style="border-collapse:collapse;flex:1">${rows.map(r=>`<tr><td style="border-bottom:1px solid #ccc;padding:6px;color:#555">${r[0]}</td><td style="border-bottom:1px solid #ccc;padding:6px"><b>${esc(r[1])}</b></td></tr>`).join('')}</table></div><h3>Cost estimate</h3>${cost.map(r=>`<div style="display:flex;justify-content:space-between;max-width:360px;padding:3px 0"><span>${r[0]}</span><span>${inr(r[1]||0)}</span></div>`).join('')}<p style="margin-top:30px">Notes: ______________________________</p><script>setTimeout(()=>print(),400)<\/script></body>`);w.document.close()}
$('#chat').onsubmit=e=>{e.preventDefault();const v=$('#inp').value;$('#inp').value='';send(v)};
document.querySelectorAll('#starters [data-t]').forEach(b=>b.onclick=()=>send(b.dataset.t));
$('#sample').onclick=async()=>{$('#starters').hidden=true;
  S.spec={...blank(),occasion:'Engagement',budget_inr:60000,style:'temple-inspired minimalist',stone:{type:'natural_diamond',carat:.3,count:1}};
  say('Loaded a sample brief: engagement ring, ₹60,000, temple-inspired.');chips();await load()};
say('Hello! Tell me the occasion, your budget and the style you like, and I will design a ring for you.');chips();empty();
</script>
</body>
</html>
